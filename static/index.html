<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SSS — Blacklist Admin</title>
<style>
  :root { --bg:#0f1420; --card:#171e2e; --line:#26304a; --tx:#dbe2f0; --mut:#8b96ad;
          --acc:#4f8cff; --ok:#2ecc71; --bad:#e74c3c; --warn:#f39c12; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--tx);
         font:14px/1.45 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
  header { display:flex; align-items:center; gap:14px; padding:14px 22px;
           background:var(--card); border-bottom:1px solid var(--line); }
  header h1 { font-size:17px; margin:0; }
  header .pill { font-size:12px; color:var(--mut); border:1px solid var(--line);
                 border-radius:20px; padding:3px 10px; }
  main { max-width:1200px; margin:22px auto; padding:0 18px;
         display:grid; grid-template-columns: 1fr 1fr; gap:18px; }
  @media (max-width: 980px){ main{grid-template-columns:1fr;} }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px;
          padding:16px; }
  .card h2 { margin:0 0 12px; font-size:15px; }
  input, textarea, select, button {
    background:#0d1320; color:var(--tx); border:1px solid var(--line);
    border-radius:6px; padding:7px 10px; font:inherit; }
  button { cursor:pointer; background:var(--acc); border-color:var(--acc); color:#fff; }
  button.ghost { background:transparent; color:var(--mut); border-color:var(--line); }
  button.ok  { background:var(--ok);  border-color:var(--ok);  }
  button.bad { background:var(--bad); border-color:var(--bad); }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin:6px 0; }
  .person { border:1px solid var(--line); border-radius:8px; padding:10px 12px; margin:10px 0; }
  .person .name { font-weight:600; }
  .person .meta { color:var(--mut); font-size:12px; }
  .thumbs { display:flex; gap:6px; margin:8px 0; flex-wrap:wrap; }
  .thumbs img { width:56px; height:56px; object-fit:cover; border-radius:6px;
                border:1px solid var(--line); }
  .camtags { display:flex; gap:6px; flex-wrap:wrap; }
  .camtag { font-size:12px; border:1px solid var(--line); border-radius:14px;
            padding:2px 9px; color:var(--mut); cursor:pointer; user-select:none; }
  .camtag.on { border-color:var(--acc); color:var(--acc); }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th, td { text-align:left; padding:7px 8px; border-bottom:1px solid var(--line); }
  th { color:var(--mut); font-weight:500; }
  td img { width:48px; height:48px; object-fit:cover; border-radius:6px;
           border:1px solid var(--line); }
  .sim { font-variant-numeric:tabular-nums; }
  .st-pending{color:var(--warn);} .st-confirmed{color:var(--ok);} .st-false_match{color:var(--bad);}
  .msg { font-size:12px; margin-top:6px; min-height:16px; }
  .msg.err{color:var(--bad);} .msg.ok{color:var(--ok);}
  .full { grid-column: 1 / -1; }
</style>
</head>
<body>
<header>
  <h1>🚫 Blacklist Admin</h1>
  <span class="pill" id="engine">engine: …</span>
  <span class="pill" id="counts">…</span>
  <span style="flex:1"></span>
  <input id="apikey" placeholder="API key (if required)" size="18" type="password">
</header>

<main>
  <section class="card">
    <h2>Add person</h2>
    <div class="row">
      <input id="np-name"  placeholder="Full name" style="flex:1">
    </div>
    <div class="row">
      <input id="np-notes" placeholder="Notes (optional)" style="flex:1">
      <button onclick="createPerson()">Create</button>
    </div>
    <div class="msg" id="np-msg"></div>

    <h2 style="margin-top:18px">People on the blacklist</h2>
    <div id="persons"></div>
  </section>

  <section class="card">
    <h2>Sightings (alerts)</h2>
    <div class="row">
      <select id="sf" onchange="loadSightings()">
        <option value="">all</option><option value="pending">pending</option>
        <option value="confirmed">confirmed</option><option value="false_match">false match</option>
      </select>
      <button class="ghost" onclick="loadSightings()">Refresh</button>
    </div>
    <table>
      <thead><tr><th>Face</th><th>Person</th><th>Camera</th><th>Sim</th><th>Status</th><th></th></tr></thead>
      <tbody id="sightings"></tbody>
    </table>
  </section>
</main>

<script>
const $ = s => document.querySelector(s);
const H = () => { const k = $('#apikey').value.trim();
                  return k ? {'X-API-Key': k} : {}; };
async function api(path, opts={}) {
  const r = await fetch(path, {...opts, headers: {...(opts.headers||{}), ...H()}});
  if (!r.ok) { let d = ''; try { d = (await r.json()).detail; } catch {}
               throw new Error(d || r.status); }
  return r.json();
}

let CAMERAS = [];

async function boot() {
  try {
    const h = await api('/health');
    $('#engine').textContent = h.engine
      ? `engine: ${h.engine.backend} @ ${h.engine.device} (thr ${h.engine.threshold})`
      : 'engine: UNAVAILABLE';
  } catch(e) { $('#engine').textContent = 'engine: ?'; }
  try {
    CAMERAS = await api('/cameras');
    const s = await api('/stats');
    $('#counts').textContent =
      `${s.persons} persons · ${s.photos} photos · ${s.sightings} sightings`;
  } catch(e) {}
  loadPersons(); loadSightings();
}

async function createPerson() {
  const name = $('#np-name').value.trim();
  const m = $('#np-msg'); m.className = 'msg';
  if (!name) { m.textContent = 'name required'; m.classList.add('err'); return; }
  try {
    await api('/persons', {method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({name, notes: $('#np-notes').value})});
    m.textContent = 'created'; m.classList.add('ok');
    $('#np-name').value = ''; $('#np-notes').value = '';
    boot();
  } catch(e) { m.textContent = e.message; m.classList.add('err'); }
}

async function loadPersons() {
  let ps = [];
  try { ps = await api('/persons'); } catch(e) { return; }
  const el = $('#persons'); el.innerHTML = '';
  for (const p of ps) {
    const camset = new Set(p.cameras);
    const div = document.createElement('div');
    div.className = 'person';
    div.innerHTML = `
      <div class="row" style="justify-content:space-between">
        <span class="name">${esc(p.name)}</span>
        <button class="bad" onclick="delPerson(${p.id})">Remove</button>
      </div>
      <div class="meta">${esc(p.notes||'')} · ${p.photos.length} photo(s)</div>
      <div class="thumbs">${p.photos.map(ph =>
        `<img src="/media/${ph.file_path}" title="quality ${ph.quality}">`).join('')}
        <label style="cursor:pointer">
          <input type="file" accept="image/*" style="display:none"
                 onchange="upload(${p.id}, this)">
          <span class="camtag">+ photo</span>
        </label>
      </div>
      <div class="camtags" id="cams-${p.id}">
        ${CAMERAS.map(c => `<span class="camtag ${camset.has(c.id)?'on':''}"
            onclick="toggleCam(${p.id}, '${c.id}', this)">${esc(c.name||c.id)}</span>`).join('')}
      </div>
      <div class="msg" id="pm-${p.id}"></div>`;
    el.appendChild(div);
    div.dataset.cams = JSON.stringify(p.cameras);
  }
}

async function upload(pid, input) {
  const m = $(`#pm-${pid}`); m.className = 'msg';
  const f = input.files[0]; if (!f) return;
  const fd = new FormData(); fd.append('file', f);
  try {
    const r = await api(`/persons/${pid}/photos`, {method:'POST', body: fd});
    m.textContent = `photo accepted (sharpness ${r.quality})`; m.classList.add('ok');
    loadPersons(); boot();
  } catch(e) { m.textContent = e.message; m.classList.add('err'); }
}

async function toggleCam(pid, camId, el) {
  const box = el.parentElement.parentElement;
  const cams = new Set(JSON.parse(box.dataset.cams || '[]'));
  cams.has(camId) ? cams.delete(camId) : cams.add(camId);
  const m = $(`#pm-${pid}`); m.className = 'msg';
  try {
    await api(`/persons/${pid}/cameras`, {method:'PUT',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({camera_ids: [...cams]})});
    box.dataset.cams = JSON.stringify([...cams]);
    el.classList.toggle('on');
    m.textContent = 'cameras updated'; m.classList.add('ok');
  } catch(e) { m.textContent = e.message; m.classList.add('err'); }
}

async function delPerson(pid) {
  if (!confirm('Remove this person from the blacklist?')) return;
  try { await api(`/persons/${pid}`, {method:'DELETE'}); boot(); } catch(e) { alert(e.message); }
}

async function loadSightings() {
  let rows = [];
  const st = $('#sf').value;
  try { rows = await api('/sightings' + (st ? `?status=${st}` : '')); } catch(e) { return; }
  const tb = $('#sightings'); tb.innerHTML = '';
  for (const s of rows) {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${s.crop_path ? `<img src="/media/${s.crop_path}">` : '—'}</td>
      <td>${esc(s.person_name)}</td>
      <td>${esc(s.camera_id)}</td>
      <td class="sim">${(s.similarity*100).toFixed(1)}%</td>
      <td class="st-${s.status}">${s.status}</td>
      <td>${s.status==='pending' ? `
        <button class="ok"  onclick="verify(${s.id},'confirmed')">✓</button>
        <button class="bad" onclick="verify(${s.id},'false_match')">✗</button>` : ''}
      </td>`;
    tb.appendChild(tr);
  }
}

async function verify(id, status) {
  try {
    await api(`/sightings/${id}/verify`, {method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({status})});
    loadSightings();
  } catch(e) { alert(e.message); }
}

function esc(s){ return String(s??'').replace(/[&<>"']/g,
  c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

boot();
setInterval(loadSightings, 10000);
</script>
</body>
</html>
